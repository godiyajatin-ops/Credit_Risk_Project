name: Core project checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn pytest
      - name: Compile project helpers
        run: python -m compileall -q src scripts tests
      - name: Check extension notebook JSON and Python syntax
        run: python scripts/verify_notebook.py
      - name: Run tests that do not require the raw Home Credit dataset
        run: python -m pytest -q
